#
# LLmRoute Portal — production stack
#
# Services:
#   1. portal — Next.js 主站实例(website + 调度器;Nginx 网页流量 → :3002)
#   2. portal-api-{1..3} — 上游 /v1 API 数据面副本(可选 profile):同镜像,
#      PORTAL_SCHEDULERS=off,只绑 127.0.0.1:3011-3013;Caddy 把
#      ai.silkroadai.io 的 /v1/* /v1beta/* least_conn 负载均衡到这三个。
#      背景:单 Node 进程单线程事件循环是天花板 —— 单客户 2,600 并发
#      opus-5(每请求数 MB JSON/SSE)把 website + API 一锅端(80 核瞎闲)。
#      副本抬吞吐 ~3×,website 与客户 API 洪峰彻底隔离。
#   3. seedance-portal — 上游 seedance 大客户独立门户(可选 profile)
#   4. portal-postgres — Postgres 16 (named volume for durability)
#
# The portal container reaches new-api (running on the VPS host, NOT in this
# compose stack) via host.docker.internal:3000. extra_hosts maps that name
# to the host gateway IP on Linux Docker.
#
# Nginx on the current host terminates the Cloudflare Origin TLS connection for
# https://llmroute.club and reverse-proxies to localhost:3002.
#
# Required project-level .env keys for compose interpolation:
#   POSTGRES_PASSWORD=<password from DATABASE_URL>
# (POSTGRES_USER and POSTGRES_DB are hardcoded below — they're not secrets.)
#
# All app secrets (DATABASE_URL, NEWAPI_*, PORTAL_JWT_SECRET, SMTP_*, etc)
# come in via env_file at portal service runtime. Only browser-safe public
# values are passed as image build args below.

x-portal-build: &portal-build
    context: .
    dockerfile: Dockerfile
    args:
        APP_URL: '${APP_URL:-https://llmroute.club}'
        NEXT_PUBLIC_APP_URL: '${NEXT_PUBLIC_APP_URL:-https://llmroute.club}'
        NEXT_PUBLIC_API_URL: '${NEXT_PUBLIC_API_URL:-https://api.llmroute.club}'
        NEXT_PUBLIC_IMAGE_URL: '${NEXT_PUBLIC_IMAGE_URL:-https://images.llmroute.club}'
        NEXT_PUBLIC_SUPPORT_EMAIL: '${NEXT_PUBLIC_SUPPORT_EMAIL:-support@llmroute.club}'
        NEXT_PUBLIC_SUPPORT_WECHAT: '${NEXT_PUBLIC_SUPPORT_WECHAT:-LLmRoute}'
        NEXT_PUBLIC_ENTERPRISE_BASE_URL: '${NEXT_PUBLIC_ENTERPRISE_BASE_URL:-http://128.241.232.23}'

# /v1 API 副本的公共块(build/env/网络与 portal 完全一致,差异只有
# container_name + host 端口 + PORTAL_SCHEDULERS=off)。
# ⚠️ networks 必须保留 gw_priority(见 portal 服务内注释,#281 事故)。
x-portal-api-common: &portal-api-common
    profiles: ['api-replicas']
    build: *portal-build
    env_file: .env
    environment:
        # 调度器只在主站 portal 单实例跑(instrumentation.ts 的门),
        # 副本双跑会 meter 游标竞态 / 余额提醒双发。
        PORTAL_SCHEDULERS: 'off'
        # 2026-08-15: Node 默认堆上限 ~4.1GB。reqlog 背压队列(100 个在途)每个
        # 攥着完整请求+响应体,大 body 并发时容易打满 → OOM。3 副本共担 /v1,各 6GB。
        NODE_OPTIONS: '--max-old-space-size=6144'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    depends_on:
        portal-postgres:
            condition: service_healthy
    networks:
        silkroadai-portal-net:
            gw_priority: 1
        newapi-net: {}
    restart: unless-stopped

# ── seedance 企业门户数据面(2026-08-07,大客户上量前扩容)──
# 单实例 → 3 副本(least_conn,Caddy 在 128.241.232.23 分流 3003/3004/3005),
# 去单点 + 分摊重参考素材(base64→R2)CPU + 故障转移。企业 flavor 本就不跑定时任务
# (instrumentation 门),再显式 PORTAL_SCHEDULERS=off 兜底防副本双跑。
x-seedance-portal-common: &seedance-portal-common
    profiles: ['seedance']
    build: *portal-build
    env_file: .env
    environment:
        PORTAL_FLAVOR: seedance-enterprise
        PORTAL_SCHEDULERS: 'off'
        # 裸 IP 入口的 cookie 修正:Domain=.silkroadai.io 对 IP host 无效(浏览器拒收)
        # → 置空回 host-scoped;HTTP 下 Secure cookie 被丢弃 → 显式关。
        # cookie Secure 现按 X-Forwarded-Proto 决定(域名 HTTPS → true;裸 IP-HTTP → 本 env=false),
        # 见 src/lib/auth/session.ts cookieSecureForRequest。
        BRAND_COOKIE_DOMAIN: ''
        SESSION_COOKIE_SECURE: 'false'
        # 企业门户对客展示的 API base URL(docs/概览页的示例 endpoint)。服务端运行时读取
        # (非 NEXT_PUBLIC → 不在 build 期烘焙,改 .env 后重启即可)。启用此可选 profile
        # 前必须配置本项目实际对客域名;未配时沿用应用既有的裸 IP 兼容回退。
        ENTERPRISE_BASE_URL: '${ENTERPRISE_BASE_URL:-http://128.241.232.23}'
    extra_hosts:
        - 'host.docker.internal:host-gateway'
    depends_on:
        portal-postgres:
            condition: service_healthy
    networks:
        - silkroadai-portal-net
        - newapi-net
    restart: unless-stopped

services:
    portal:
        build: *portal-build
        container_name: silkroadai-portal
        ports:
            # Bind to loopback only — public traffic must go through the host
            # Caddy/nginx reverse proxy, never hit the container port directly.
            - '127.0.0.1:3002:3002'
        env_file: .env
        environment:
            # 2026-08-15: 本实例曾因 apex /v1 流量未分流(Caddy 已加 @portalv1 →
            # 3011-3013)每 ~10 分钟 OOM 一次。单实例 + 跑全部调度器,不可替代 →
            # 堆上限抬到 8GB 兜底。⚠️ Caddy 那半边改动【不在本仓库】,见
            # /etc/caddy/Caddyfile.bak-apex-v1-split-*。
            NODE_OPTIONS: '--max-old-space-size=8192'
        extra_hosts:
            # Linux Docker doesn't auto-add host.docker.internal; this maps it to
            # the gateway so portal can reach new-api on the VPS host port 3000.
            - 'host.docker.internal:host-gateway'
        depends_on:
            portal-postgres:
                condition: service_healthy
        networks:
            # ⚠️ gw_priority 必须留在 portal-net:portal 出网到 host.docker.internal:3000
            # (new-api)靠默认路由。不设优先级时 docker 按网络名排序选默认网关,
            # new-api_* 排在 silkroadai_* 前 → 默认路由切到 new-api 网桥 → 访问宿主
            # 发布端口变成同网桥 hairpin,被 docker 的 `! -i br-x` 放行规则拒 →
            # 全部 /v1/* 客户请求 10s 连接超时(2026-07-28 事故,10:44-10:54 北京)。
            silkroadai-portal-net:
                gw_priority: 1
            # 只读直连 new-api 日志库(admin 日志导出),见 src/lib/newapi/logs-db.ts。
            # external 网络由 new-api 的 compose 栈创建,portal 只是加入;
            # 只用于同网段直达 new-api-db:5432,不承载默认路由。
            newapi-net: {}
        restart: unless-stopped

    # ── /v1 API 数据面副本(2026-07-28,见文件头 #2)──
    # 只绑 127.0.0.1 —— 公网入口只有 Caddy(ai.silkroadai.io /v1/* /v1beta/*
    # least_conn → 3011/3012/3013)。website 域名仍指 :3002,不受 API 洪峰影响。
    portal-api-1:
        <<: *portal-api-common
        container_name: silkroadai-portal-api-1
        ports:
            - '127.0.0.1:3011:3002'

    portal-api-2:
        <<: *portal-api-common
        container_name: silkroadai-portal-api-2
        ports:
            - '127.0.0.1:3012:3002'

    portal-api-3:
        <<: *portal-api-common
        container_name: silkroadai-portal-api-3
        ports:
            - '127.0.0.1:3013:3002'

    # 2026-08-16 扩容 3→6:全量图片流量走【适配器+代理双跳】,每张图两边都做 CPU 密集处理
    # (大 b64 解码 / C2PA 剥离 / 多 MB 响应 JSON 解析)→ Node 单线程事件循环饱和(3 副本各 95-127% CPU)
    # → 异步 fetch 完成被推迟到 100s+(直连仅 22s)→ 客户 5-16min 超时。宿主机 80 核 load 4.35 余量足,
    # 加副本分摊事件循环即可。上游部署需要同步入口负载均衡池；当前 LLmRoute 生产使用 Nginx
    # 单实例且默认不启用 api-replicas profile,若要启用必须另行完成 Nginx upstream 配置与验收。
    portal-api-4:
        <<: *portal-api-common
        container_name: silkroadai-portal-api-4
        ports:
            - '127.0.0.1:3014:3002'

    portal-api-5:
        <<: *portal-api-common
        container_name: silkroadai-portal-api-5
        ports:
            - '127.0.0.1:3015:3002'

    portal-api-6:
        <<: *portal-api-common
        container_name: silkroadai-portal-api-6
        ports:
            - '127.0.0.1:3016:3002'

    # ── seedance 大客户独立门户(P1,seedance-enterprise-portal-design.md)──
    # 同镜像同库,PORTAL_FLAVOR 切形态:/v1 只服务 seedance 视频端点,主站页面/API 404,
    # 定时任务不跑(instrumentation 门)。三个实例只绑 127.0.0.1:3003-3005 —— 公网入口由
    # Caddy 在 128.241.232.23(HTTP :80 + tls internal :443)least_conn 分流,其余路径 404。
    # 继承 seedance profile,默认发布不会启动企业门户副本。
    # seedance 企业门户三副本无状态(共享数据库),任意副本可处理任意提交/轮询。
    seedance-portal:
        <<: *seedance-portal-common
        container_name: silkroadai-seedance-portal
        ports:
            - '127.0.0.1:3003:3002'

    seedance-portal-2:
        <<: *seedance-portal-common
        container_name: silkroadai-seedance-portal-2
        ports:
            - '127.0.0.1:3004:3002'

    seedance-portal-3:
        <<: *seedance-portal-common
        container_name: silkroadai-seedance-portal-3
        ports:
            - '127.0.0.1:3005:3002'

    portal-postgres:
        image: postgres:16-alpine
        container_name: silkroadai-portal-db
        ports:
            # Loopback-only publish for SSH-tunnel admin access (e.g. Navicat).
            # NEVER 0.0.0.0 — that exposes Postgres to the public internet.
            - '127.0.0.1:5432:5432'
        environment:
            POSTGRES_USER: portal
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: silkroadai_portal_prod
        volumes:
            - portal_pg_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U portal -d silkroadai_portal_prod']
            interval: 5s
            timeout: 5s
            retries: 12
        # No port published to host — only the portal container reaches it via
        # the silkroadai-portal-net network. Reduces attack surface.
        networks:
            - silkroadai-portal-net
        restart: unless-stopped

volumes:
    portal_pg_data:
        name: silkroadai-portal-pg-data

networks:
    silkroadai-portal-net:
        name: silkroadai-portal-net
        driver: bridge
    newapi-net:
        name: new-api_new-api-net
        external: true
