# LLmRoute website virtual host for AlmaLinux Nginx.
# Install as /etc/nginx/conf.d/llmroute.club.conf, then run `nginx -t`.
# Do not log query strings: OAuth codes, reset tokens, and payment callback
# signatures can all arrive in the URL.
log_format llmroute_web '$remote_addr [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       'rt=$request_time urt=$upstream_response_time '
                       'cf_ip=$http_cf_connecting_ip';

server {
    listen 80;
    listen [::]:80;
    server_name llmroute.club www.llmroute.club;

    access_log /var/log/nginx/llmroute.club.access.log llmroute_web;
    error_log /var/log/nginx/llmroute.club.error.log warn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name llmroute.club www.llmroute.club;

    ssl_certificate /etc/nginx/ssl/llmroute.club.pem;
    ssl_certificate_key /etc/nginx/ssl/llmroute.club.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/llmroute.club.access.log llmroute_web;
    error_log /var/log/nginx/llmroute.club.error.log warn;

    client_max_body_size 25m;

    # Internal new-api upstream adapter. It only checks that Authorization is
    # present and then forwards that credential to the provider, so it must not
    # be a public customer endpoint. new-api reaches it over the shared Docker
    # network at http://silkroadai-portal:3002/image-adapter/<provider>.
    location ^~ /image-adapter/ {
        default_type application/json;
        return 404 '{"error":{"message":"Not found","type":"not_found"}}';
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
