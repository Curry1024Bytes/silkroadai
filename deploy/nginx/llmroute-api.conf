# LLmRoute customer API virtual host for AlmaLinux Nginx.
# Install as /etc/nginx/conf.d/llmroute-api.conf, then run `nginx -t`.
#
# The access format intentionally logs $uri instead of $request_uri so Gemini
# clients using ?key= do not write API keys into the origin access log.
log_format llmroute_api '$remote_addr [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        'rt=$request_time urt=$upstream_response_time '
                        'cf_ip=$http_cf_connecting_ip request_id=$upstream_http_x_oneapi_request_id';

server {
    listen 80;
    listen [::]:80;
    server_name api.llmroute.club;

    access_log /var/log/nginx/api.llmroute.club.access.log llmroute_api;
    error_log /var/log/nginx/api.llmroute.club.error.log warn;

    return 301 https://api.llmroute.club$request_uri;
}

server {
    # Match the existing AlmaLinux Nginx listener options. Cloudflare serves
    # HTTP/2 or HTTP/3 to clients; the origin connection does not need HTTP/2.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.llmroute.club;

    ssl_certificate /etc/nginx/ssl/llmroute.club.pem;
    ssl_certificate_key /etc/nginx/ssl/llmroute.club.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/api.llmroute.club.access.log llmroute_api;
    error_log /var/log/nginx/api.llmroute.club.error.log warn;

    server_tokens off;
    client_max_body_size 100m;
    client_body_timeout 120s;
    send_timeout 650s;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Link '<https://github.com/Curry1024Bytes/new-api/tree/v1.0.0-rc.23-llmroute.1>; rel="source"' always;
    add_header X-LLmRoute-Source "https://github.com/Curry1024Bytes/new-api/tree/v1.0.0-rc.23-llmroute.1" always;
    add_header Access-Control-Expose-Headers "Link, X-LLmRoute-Source, X-New-Api-Version" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header Connection "";

    proxy_connect_timeout 10s;
    proxy_send_timeout 650s;
    proxy_read_timeout 650s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    gzip off;

    # Public customer API surfaces. Keep the original URI and query string.
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:3002;
    }

    location ^~ /v1beta/ {
        proxy_pass http://127.0.0.1:3002;
    }

    # Do not expose Portal login, admin, payment, or internal API routes on
    # the machine-facing API hostname.
    location / {
        default_type application/json;
        return 404 '{"error":{"message":"Not found","type":"not_found"}}';
    }
}
