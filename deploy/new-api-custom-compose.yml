# LLmRoute new-api custom-full production stack.
#
# This file intentionally lives in the Portal repository so a fresh server
# does not depend on the untracked .codex/fresh-new-api-compose.yml file.
# Run it with --env-file /opt/new-api/.env from the new-api checkout.

services:
    postgres:
        image: postgres:15
        container_name: postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: new-api
        volumes:
            - new-api-pg-data:/var/lib/postgresql/data
        networks:
            - new-api-net
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U root -d new-api']
            interval: 5s
            timeout: 5s
            retries: 12

    redis:
        image: redis:7-alpine
        container_name: redis
        restart: unless-stopped
        command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
        networks:
            - new-api-net

    new-api:
        image: new-api-custom:latest
        container_name: new-api
        restart: unless-stopped
        command: ['--log-dir', '/app/logs']
        ports:
            # Portal reaches this through host.docker.internal. Never publish 0.0.0.0.
            - '172.17.0.1:3000:3000'
        volumes:
            - ${NEW_API_DATA_DIR:-/opt/new-api/data}:/data:Z
            - ${NEW_API_LOG_DIR:-/opt/new-api/logs}:/app/logs:Z
        environment:
            SQL_DSN: postgresql://root:${POSTGRES_PASSWORD}@postgres:5432/new-api
            REDIS_CONN_STRING: redis://:${REDIS_PASSWORD}@redis:6379
            SESSION_SECRET: ${SESSION_SECRET}
            CRYPTO_SECRET: ${CRYPTO_SECRET}
            TZ: Asia/Shanghai
            ERROR_LOG_ENABLED: 'true'
            BATCH_UPDATE_ENABLED: 'true'
            NODE_NAME: new-api-node-1
            # The admin UI is reached only through the local HTTP SSH tunnel.
            SESSION_COOKIE_SECURE: 'false'
            # SESSION_COOKIE_TRUSTED_URL must be unset when SECURE=false. Set both
            # values in a separate HTTPS management deployment if this access mode
            # is changed in the future.
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_started
        networks:
            - new-api-net
        healthcheck:
            test: ['CMD-SHELL', 'wget -q -O - http://localhost:3000/api/status | grep -q ''"success":true''']
            interval: 10s
            timeout: 5s
            retries: 12

volumes:
    new-api-pg-data:
        name: new-api-pg-data-fresh

networks:
    new-api-net:
        name: new-api_new-api-net
        driver: bridge
